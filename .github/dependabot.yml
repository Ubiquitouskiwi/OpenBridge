version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Packages that must move together. Bumping one alone leaves package-lock.json unable to
      # satisfy peer ranges, and `npm ci` fails in CI (for example @eslint/js 10 needs eslint 10).
      eslint:
        patterns: ['eslint', '@eslint/*', '@typescript-eslint/*']
      i18next:
        patterns: ['i18next', 'react-i18next']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    # @types/node matches the Node LTS line we run (24); a new major would type APIs we lack.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: npm
    directory: /infra
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # One pull request for all action updates, so workflows move together.
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
  # Base images in the Dockerfiles (node, nginx-unprivileged).
  - package-ecosystem: docker
    directories: ['/', '/packages/mcp-server', '/packaging/hosted']
    schedule:
      interval: monthly
    # Stay on the Node LTS line in .nvmrc (24). Dependabot otherwise offers each new major,
    # including odd-numbered releases (25, 27) that never become LTS. Move majors by hand.
    ignore:
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: build
