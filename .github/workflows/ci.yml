name: CI

on:
  push:
    branches: [mainline]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (format, lint, types, tests, build, data, copy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify
        run: npm run verify

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      # Fresh runner: the workspace packages (shared, engine, form-assembly) resolve to their
      # dist/ output, so build everything before the apps are bundled for testing.
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # Run both suites even if the first fails, so one failure does not hide the other.
      - name: Run web app end-to-end tests
        run: npm run e2e -w @openbridge/web-app
      - name: Run rule toolkit end-to-end tests
        if: success() || failure()
        run: npm run e2e -w @openbridge/rule-toolkit
      - name: Upload Playwright reports and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            packages/web-app/playwright-report
            packages/web-app/test-results
            packages/rule-toolkit/playwright-report
            packages/rule-toolkit/test-results
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Container image builds
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          push: false
          load: true
          tags: openbridge:ci
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,mode=max,scope=ci-image
      - name: Smoke test the container
        run: |
          docker run -d --name ob -p 127.0.0.1:8080:8080 openbridge:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsSI http://127.0.0.1:8080/ | grep -qi '^content-security-policy:'
          docker rm -f ob
