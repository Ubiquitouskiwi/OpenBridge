name: Release

# Builds and publishes an OpenBridge release from the Actions tab ("Run workflow").
# Produces these downloads on one GitHub Release (see docs/RELEASING.md):
#   - openbridge-hosted-v<version>.tar.gz            static site, Docker/Compose files, server examples
#   - openbridge-local-v<version>.zip                single-file app, double-click to run offline
#   - openbridge-image-v<version>-linux-<arch>.tar.gz  prebuilt container images (docker load)
# plus SHA256SUMS.txt. Images are attached as files only; nothing is pushed to a registry.
# Every release is gated on the same checks as CI.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (for example 0.2.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as a pre-release (keep on while rules are unverified)'
        required: true
        default: true
        type: boolean
      draft:
        description: 'Create as a draft so you can review it before publishing'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a version like 1.2.3 or 1.2.3-beta.1"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists. Pick a new version."
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Verify (format, lint, types, tests, build, data, copy)
        run: npm run verify

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end and accessibility tests
        run: npm run e2e

      - name: Build the single-file local version
        run: npm run build:local -w @openbridge/web-app

      - name: Package downloads
        env:
          VERSION: ${{ inputs.version }}
        run: npm run release:package -- --version "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: release-artifacts/
          retention-days: 7
          if-no-files-found: error

  image:
    name: Container image (${{ matrix.arch }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Built and saved as a tarball for the release; never pushed to a registry.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          tags: openbridge:${{ inputs.version }}
          build-args: |
            VERSION=${{ inputs.version }}
            REVISION=${{ github.sha }}
          outputs: type=docker,dest=/tmp/openbridge-image.tar
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

      - name: Compress image
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p image-artifacts
          gzip -9 -c /tmp/openbridge-image.tar > "image-artifacts/openbridge-image-v${VERSION}-linux-${ARCH}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.arch }}
          path: image-artifacts/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Write checksums for every download
        working-directory: release-artifacts
        run: |
          rm -f SHA256SUMS.txt
          sha256sum -- *.tar.gz *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          if [ "$DRAFT" = "true" ]; then flags+=(--draft); fi
          gh release create "v$VERSION" \
            release-artifacts/*.tar.gz release-artifacts/*.zip release-artifacts/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "OpenBridge v$VERSION" \
            --notes-file .github/release-notes-template.md \
            --generate-notes \
            "${flags[@]}"
