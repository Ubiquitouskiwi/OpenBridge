# Example nginx site for OpenBridge. Copy the contents of ./site to the root below.
# Terminate HTTPS here (for example with certbot). The app is static and stores nothing.

server {
    listen 443 ssl;
    http2 on;
    server_name benefits.example.org;

    # ssl_certificate     /etc/letsencrypt/live/benefits.example.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/benefits.example.org/privkey.pem;

    root /var/www/openbridge;
    index index.html;

    # The app collects no analytics. Turn off access logs to match that promise.
    access_log off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Note: an add_header inside a location replaces ALL server-level add_header lines, so the
    # blocks below repeat the security headers they need.

    # Hashed build assets never change; cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # The service worker and app shell must always be fresh so updates reach users.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Single-page app: unknown paths load the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name benefits.example.org;
    return 301 https://$host$request_uri;
}
